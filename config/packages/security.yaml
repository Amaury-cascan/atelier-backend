security:
    # Configuration de hachage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Configuration du fournisseur d'utilisateurs
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Configurations des pare-feux
    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~  # Authentification JWT

        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false  # Désactiver la sécurité pour les outils de développement

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true  # Activer la protection CSRF pour le formulaire de connexion
            logout:
                path: app_logout
                target: /login  # Rediriger après la déconnexion

    # Règles de contrôle d'accès
    access_control:
        # Les routes sous /administration nécessitent le rôle ROLE_ADMIN
        - { path: ^/administration, roles: [ROLE_ADMIN] }  # Protège toutes les routes sous /administration

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon